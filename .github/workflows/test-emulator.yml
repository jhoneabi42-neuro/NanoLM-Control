name: Testar APK no emulador

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-emulator.yml'

permissions:
  contents: read
  actions: read

jobs:
  test-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 system-images;android-35;google_apis;x86_64'

      - name: Download APK artifact from run 9
        uses: actions/download-artifact@v4
        with:
          name: NanoLM-Control-debug
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42335921418
          path: apk-download

      - name: Verify APK present
        run: |
          set -euo pipefail
          ls -la apk-download/
          APK=$(find apk-download -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found in artifact"
            exit 1
          fi
          echo "APK=$APK" >> $GITHUB_ENV
          sha256sum "$APK"
          # Expected digest from artifact metadata (run 9)
          EXPECTED="b363fea3652ad66d8fe8dc1ab0c7701b6440efeed8a495e2f7c566433627457a"
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          # Note: digest on the zip vs the apk may differ; we only require the file to exist and be readable
          unzip -t "$APK" || true
          aapt dump badging "$APK" || true

      - name: Create AVD and start emulator
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd -n test_avd -k "system-images;android-35;google_apis;x86_64" --device "pixel_6" --force
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -gpu swiftshader_indirect -no-snapshot &
          echo $! > emulator.pid
          # Wait for boot
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 3; done'
          adb shell input keyevent 82 || true
          echo "Emulator booted"

      - name: Install and launch APK
        run: |
          set -euo pipefail
          adb install -r "$APK"
          PACKAGE="com.nanolm.control"
          ACTIVITY="com.nanolm.control.MainActivity"
          adb shell am force-stop "$PACKAGE" || true
          adb shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 5
          # Capture process after launch
          adb shell "ps -A | grep nanolm" || true
          adb shell dumpsys activity activities | grep -A5 "mResumedActivity" || true

      - name: Wait and re-check process still alive
        run: |
          set -euo pipefail
          PACKAGE="com.nanolm.control"
          sleep 15
          # Must still have the process
          if ! adb shell "ps -A" | grep -q nanolm; then
            echo "Process died within 15s"
            adb logcat -d -t 200 | tail -100
            exit 1
          fi
          # Prefer MainActivity still in foreground if possible
          adb shell dumpsys activity activities | grep -A8 "mResumedActivity" || true
          echo "Process still running after 15s"

      - name: Screenshot
        if: always()
        run: |
          mkdir -p resultado
          adb exec-out screencap -p > resultado/tela.png || true
          adb logcat -d -t 300 > resultado/logcat.txt || true
          adb shell dumpsys package com.nanolm.control > resultado/package.txt || true
          ls -la resultado/

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-emulador
          path: resultado/
          if-no-files-found: warn

      - name: Stop emulator
        if: always()
        run: |
          adb emu kill || true
          if [ -f emulator.pid ]; then kill $(cat emulator.pid) 2>/dev/null || true; fi
